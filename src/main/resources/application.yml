server:
  port: 8080
spring:
  application.name: distributed-job-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobs}
    username: ${DB_USER:jobs}
    password: ${DB_PASSWORD:jobs}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  data.redis.host: ${REDIS_HOST:localhost}
  data.redis.port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:jobs}
    password: ${RABBIT_PASSWORD:jobs}
    listener.simple:
      concurrency: ${WORKER_CONCURRENCY:4}
      max-concurrency: ${WORKER_MAX_CONCURRENCY:8}
      prefetch: 1
      default-requeue-rejected: false
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.show-details: always
  metrics.tags.application: distributed-job-platform
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-32chars-minimum}
    expiration-ms: 86400000
  jobs:
    max-attempts: 4
    retry-delay-ms: 10000
    outbox-poll-ms: 1000
    rate-limit-per-minute: 60
