services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: jobs, POSTGRES_USER: jobs, POSTGRES_PASSWORD: jobs }
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: jobs, RABBITMQ_DEFAULT_PASS: jobs }
    ports: ["5672:5672", "15672:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 10 }
  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobs
      DB_USER: jobs
      DB_PASSWORD: jobs
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq
      RABBIT_USER: jobs
      RABBIT_PASSWORD: jobs
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-32chars-minimum}
      WORKER_CONCURRENCY: 4
    ports: ["8080:8080"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    depends_on: [app]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on: [prometheus]
volumes:
  pgdata:
